[project]
name = "mimic-server"
version = "0.1.1"
description = "Self-hosted voice-cloning TTS server (mimic-tts)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",
    "chatterbox-tts",
    # perth (chatterbox's watermarker dep) imports pkg_resources from setuptools,
    # which Python 3.12+ no longer ships by default. Without this, model load
    # silently sets PerthImplicitWatermarker = None and crashes at synth time.
    "setuptools",
    "torch>=2.6.0,<2.7.0",
    "torchaudio>=2.6.0,<2.7.0",
    "soundfile",
    "python-multipart",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx",
]

[project.scripts]
mimic-server = "mimic_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimic_server"]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
