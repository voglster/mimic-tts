name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # gh release create
  id-token: write       # PyPI Trusted Publishing OIDC
  packages: write       # GHCR push

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Build client wheel
        run: uv build --package mimic-tts --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-wheel
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-docker:
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image owner
        id: img
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/mimic-tts:${{ github.ref_name }}
            ghcr.io/${{ steps.img.outputs.owner }}/mimic-tts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-pypi, publish-docker]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Collect commit history since previous tag
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          PREV="${PREV:-$(git rev-list --max-parents=0 HEAD)}"
          git log --oneline "${PREV}..HEAD" > commits.txt
          git diff --stat "${PREV}..HEAD" > stats.txt

      - name: Generate AI release notes (best-effort)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "LLM_API_KEY not set; using minimal notes."
            echo "Release ${REF_NAME}." > RELEASE_NOTES.md
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request, pathlib
          base = os.environ['LLM_BASE_URL'].rstrip('/')
          ref = os.environ['REF_NAME']
          commits = pathlib.Path('commits.txt').read_text()
          stats = pathlib.Path('stats.txt').read_text()
          prompt = (
              f"Generate concise release notes for mimic-tts {ref}.\n"
              "mimic-tts is a self-hosted Qwen3-TTS voice cloning + synthesis service "
              "with a Python client.\n\n"
              f"Commits since last release:\n{commits}\n\n"
              f"Diff stats:\n{stats}\n\n"
              "Format: brief intro, then bulleted list grouped by Features / Fixes / Other. "
              "Keep it short."
          )
          body = json.dumps({
              'model': os.environ['LLM_MODEL'],
              'max_tokens': 1024,
              'messages': [{'role': 'user', 'content': prompt}],
          }).encode()
          req = urllib.request.Request(
              f'{base}/chat/completions',
              data=body,
              headers={
                  'Authorization': f"Bearer {os.environ['LLM_API_KEY']}",
                  'Content-Type': 'application/json',
              },
          )
          resp = json.loads(urllib.request.urlopen(req).read())
          pathlib.Path('RELEASE_NOTES.md').write_text(resp['choices'][0]['message']['content'])
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f RELEASE_NOTES.md || echo "Release ${{ github.ref_name }}." > RELEASE_NOTES.md
          gh release create "${{ github.ref_name }}" dist/*.whl \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
