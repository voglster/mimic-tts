[project]
name = "mimic-tts"
version = "0.2.2"
description = "Client for mimic-tts (Qwen3-TTS voice cloning + synthesis)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jim Vogel" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "platformdirs>=4.0",
]

[project.scripts]
mimic = "mimic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mimic/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["mimic"]
